<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบทดสอบการสังเคราะห์ด้วยแสง — 100 ข้อ</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--accent:#2563eb;--line:#dbe3ef;--good:#15803d;--bad:#dc2626}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;line-height:1.65}
header{background:linear-gradient(135deg,#1d4ed8,#4f46e5);color:#fff;padding:28px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(22px,5vw,34px)} header p{margin:0;opacity:.9}
.wrap{max-width:900px;margin:20px auto;padding:0 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 18px #1e293b0b}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px} input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.progress{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
.bar{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.2s}
.sec{font-size:18px;font-weight:800;margin:24px 0 10px;padding:10px 12px;border-left:5px solid var(--accent);background:#eef4ff;border-radius:8px}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.q h3{font-size:16px;margin:0 0 10px} .opt{display:block;padding:9px 10px;margin:6px 0;border:1px solid transparent;border-radius:9px;cursor:pointer}
.opt:hover{background:#f4f7ff} .opt input{margin-right:8px;accent-color:var(--accent)}
button{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}
#submit{background:var(--accent);color:white;width:100%;margin:14px 0} #reset{background:#e8edf5;color:var(--text)}
#result{display:none} .score{font-size:30px;font-weight:900;text-align:center;margin:8px 0} .muted{color:var(--muted);font-size:14px}
.review{border-top:1px solid var(--line);padding:10px 0} .correct{color:var(--good);font-weight:700} .wrong{color:var(--bad);font-weight:700}
@media(max-width:600px){.info{grid-template-columns:1fr} .q{padding:13px}}
</style>
</head>
<body>
<header><h1>แบบทดสอบการสังเคราะห์ด้วยแสง</h1><p>บทที่ 11 • 100 ข้อ • แบบเลือกตอบ 4 ตัวเลือก</p></header>
<div class="wrap">
<div class="panel">
<div class="info"><div></div></div>
<p class="muted">เลือกคำตอบที่คิดว่าถูกที่สุดให้ครบ แล้วกด “ส่งคำตอบ” ระบบจะคำนวณคะแนนให้ทันที</p>
</div>
<div class="progress"><div><b id="count">ตอบแล้ว 0/100 ข้อ</b></div><div class="bar"><i id="bar"></i></div></div>
<form id="quiz"></form>
<button id="submit" type="button">ส่งคำตอบและตรวจคะแนน</button>
<div id="result" class="panel"></div>
</div>
<script>
const QUESTIONS=[{"n": 1, "q": "สมมติฐานของแวน นีล (van Niel) เกี่ยวกับที่มาของ O₂ ในการสังเคราะห์ด้วยแสงคืออะไร", "opts": [{"l": "ก", "t": "O₂ มาจากการสลายตัวของ CO₂"}, {"l": "ข", "t": "O₂ มาจากการสลายตัวของโมเลกุลน้ำ"}, {"l": "ค", "t": "O₂ มาจากน้ำตาลที่พืชสร้างขึ้น"}, {"l": "ง", "t": "O₂ มาจากอากาศที่พืชดูดซึมเข้าไปโดยตรง"}], "a": "ข", "section": "สมมติฐานที่มาของ O₂ และการทดลองของแวน นีล"}, {"n": 2, "q": "แวน นีล ตั้งสมมติฐานข้างต้นจากการเปรียบเทียบสูตรโมเลกุลของสารใด", "opts": [{"l": "ก", "t": "CO₂ กับ O₂"}, {"l": "ข", "t": "H₂S กับ H₂O"}, {"l": "ค", "t": "กลูโคสกับฟรุกโทส"}, {"l": "ง", "t": "NADP⁺ กับ NADPH"}], "a": "ข", "section": "สมมติฐานที่มาของ O₂ และการทดลองของแวน นีล"}, {"n": 3, "q": "ในการทดลองของแวน นีล เมื่อเลี้ยงแบคทีเรียสังเคราะห์แสงด้วย H₂S แทนน้ำ ผลผลิตที่ได้แทนที่ O₂ คือสารใด", "opts": [{"l": "ก", "t": "ซัลเฟอร์ (S)"}, {"l": "ข", "t": "ไฮโดรเจน (H₂)"}, {"l": "ค", "t": "ไนโตรเจน (N₂)"}, {"l": "ง", "t": "ซัลเฟอร์ไดออกไซด์ (SO₂)"}], "a": "ก", "section": "สมมติฐานที่มาของ O₂ และการทดลองของแวน นีล"}, {"n": 4, "q": "ใครคือผู้ทำการทดลองยืนยันสมมติฐานของแวน นีล", "opts": [{"l": "ก", "t": "เมลวิน คาลวิน"}, {"l": "ข", "t": "เองเกลมันน์"}, {"l": "ค", "t": "แซม รูเบน และ มาร์ติน คาเมน"}, {"l": "ง", "t": "เอิร์นส์ มึนช์"}], "a": "ค", "section": "สมมติฐานที่มาของ O₂ และการทดลองของแวน นีล"}, {"n": 5, "q": "การทดลองของรูเบนและคาเมนใช้สิ่งมีชีวิตชนิดใด", "opts": [{"l": "ก", "t": "แบคทีเรียสังเคราะห์แสง"}, {"l": "ข", "t": "สาหร่ายคลอเรลลา (Chlorella sp.)"}, {"l": "ค", "t": "สาหร่ายสไปโรไจรา"}, {"l": "ง", "t": "พืชชั้นสูงทั่วไป"}], "a": "ข", "section": "สมมติฐานที่มาของ O₂ และการทดลองของแวน นีล"}, {"n": 6, "q": "เทคนิคที่รูเบนและคาเมนใช้ในการติดตามที่มาของ O₂ คือข้อใด", "opts": [{"l": "ก", "t": "การย้อมสีเซลล์"}, {"l": "ข", "t": "ไอโซโทปของออกซิเจน (¹⁶O และ ¹⁸O)"}, {"l": "ค", "t": "กล้องจุลทรรศน์อิเล็กตรอน"}, {"l": "ง", "t": "โครมาโทกราฟี"}], "a": "ข", "section": "สมมติฐานที่มาของ O₂ และการทดลองของแวน นีล"}, {"n": 7, "q": "ในการทดลองของรูเบนและคาเมน หากให้ CO₂ เป็  r+='<p style="text-align:center" class="muted">คิดเป็น '+score+'%</p><details><summary><b>ดูเฉลยและตรวจคำตอบ</b></summary>';
 rows.forEach(v=>{r+='<div class="review"><b>ข้อ '+v.n+'</b> — '+(v.ok?'<span class="correct">ถูก</span>':'<span class="wrong">ผิด</span>')+'<br>คำตอบของคุณ: '+v.got+' • เฉลย: '+v.a+'</div>'});
